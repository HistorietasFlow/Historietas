name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_USER_EMAIL: e2e-author@historietas.test
      E2E_ALLOW_DESTRUCTIVE: "true"
      E2E_PUBLIC_WORK_SLUG: obra-publica-e2e
      E2E_PUBLIC_CHAPTER_NUMBER: "1"
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix qa ci

      - name: Executar testes estáticos
        run: npm run test:static

      - name: Executar testes de paginação em alto volume
        run: npm run test:pagination

      - name: Executar testes de recuperação de sessão
        run: npm run test:session

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 2.116.0

      - name: Iniciar ambiente Supabase local descartável
        run: |
          supabase init
          cp \
            qa/integration/supabase/20260826000637_normalizar_acl_baseline_local.sql \
            supabase/migrations/20260826000637_normalizar_acl_baseline_local.sql
          for tentativa in 1 2 3; do
            if supabase start; then
              break
            fi

            if [ "$tentativa" -eq 3 ]; then
              echo "Falha ao iniciar o Supabase local após 3 tentativas."
              exit 1
            fi

            espera=$((tentativa * 10))
            echo "Tentativa $tentativa falhou; aguardando ${espera}s antes de tentar novamente."
            sleep "$espera"
          done

      - name: Executar paginação real pela Data API
        run: npm run test:pagination:integration

      - name: Executar proteção anti-spam pela Data API
        run: npm run test:spam:integration

      - name: Preparar autenticação e conteúdo E2E locais
        run: npm run test:e2e:prepare:local -- --github-env "$GITHUB_ENV"

      - name: Gerar aplicação para os testes locais
        run: npm run build

      - name: Instalar Chromium
        working-directory: qa
        run: npm exec -- playwright install --with-deps chromium

      - name: Executar testes públicos e autenticados no código do PR
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_WEB_SERVER_COMMAND: npm --prefix .. run start
        run: npm --prefix qa test

      - name: Remover ambiente Supabase local
        if: ${{ always() }}
        run: |
          if supabase status >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

      - name: Salvar diagnóstico do Playwright em caso de falha
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            qa/playwright-report
            qa/reports/playwright-results.json
            qa/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build
