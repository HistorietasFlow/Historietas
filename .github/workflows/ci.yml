name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_USER_EMAIL: e2e-author@historietas.test
      E2E_ALLOW_DESTRUCTIVE: "true"
      E2E_PUBLIC_WORK_SLUG: obra-publica-e2e
      E2E_PUBLIC_CHAPTER_NUMBER: "1"
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix qa ci

      - name: Executar testes estáticos
        run: npm run test:static

      - name: Validar GRANT/REVOKE explícito em novas tabelas public
        run: node qa/scripts/check-public-table-grants.mjs

      - name: Executar testes de paginação em alto volume
        run: npm run test:pagination

      - name: Executar testes de recuperação de sessão
        run: npm run test:session

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.116.0

      - name: Confirmar versão do Supabase CLI
        run: test "$(supabase --version)" = "2.116.0"

      - name: Iniciar ambiente Supabase local descartável
        run: |
          supabase init
          cp \
            qa/integration/supabase/20260826000637_normalizar_acl_baseline_local.sql \
            supabase/migrations/20260826000637_normalizar_acl_baseline_local.sql
          for tentativa in 1 2 3; do
            if supabase start; then
              break
            fi

            if [ "$tentativa" -eq 3 ]; then
              echo "Falha ao iniciar o Supabase local após 3 tentativas."
              exit 1
            fi

            espera=$((tentativa * 10))
            echo "Tentativa $tentativa falhou; aguardando ${espera}s antes de tentar novamente."
            sleep "$espera"
          done

      - name: Executar testes de banco com pgTAP
        run: supabase test db

      - name: Executar paginação real pela Data API
        run: npm run test:pagination:integration

      - name: Executar proteção anti-spam pela Data API
        run: npm run test:spam:integration

      - name: Validar policies do Storage pela API local
        run: npm run test:storage:integration

      - name: Preparar autenticação e conteúdo E2E locais
        run: npm run test:e2e:prepare:local -- --github-env "$GITHUB_ENV"

      - name: Gerar aplicação para os testes locais
        run: npm run build

      - name: Instalar Chromium
        working-directory: qa
        run: npm exec -- playwright install --with-deps chromium

      - name: Executar testes públicos e autenticados no código do PR
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_WEB_SERVER_COMMAND: npm --prefix .. run start
        run: npm --prefix qa test

      - name: Instalar Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Executar Lighthouse CI baseline
        run: lhci autorun

      - name: Instalar k6 2.3.0 com checksum
        shell: bash
        run: |
          set -euo pipefail

          version="2.3.0"
          archive="k6-v${version}-linux-amd64.tar.gz"
          base_url="https://github.com/grafana/k6/releases/download/v${version}"

          curl --fail --location --silent --show-error             --output "/tmp/${archive}"             "${base_url}/${archive}"
          curl --fail --location --silent --show-error             --output /tmp/k6-checksums.txt             "${base_url}/k6-v${version}-checksums.txt"

          (
            cd /tmp
            grep "  ${archive}$" k6-checksums.txt | sha256sum --check
          )

          rm -rf /tmp/k6-install
          mkdir -p /tmp/k6-install
          tar -xzf "/tmp/${archive}" -C /tmp/k6-install

          k6_binary="$(find /tmp/k6-install -type f -name k6 -print -quit)"
          if [ -z "$k6_binary" ]; then
            echo "Binário do k6 não encontrado no arquivo oficial."
            exit 1
          fi

          sudo install -m 0755 "$k6_binary" /usr/local/bin/k6
          k6 version

      - name: Executar k6 baseline leve no app local
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p qa/reports/k6

          ./node_modules/.bin/next start             --hostname 127.0.0.1             --port 3000             > /tmp/historietas-k6-app.log 2>&1 &
          app_pid=$!

          cleanup() {
            if kill -0 "$app_pid" >/dev/null 2>&1; then
              kill "$app_pid" >/dev/null 2>&1 || true
              wait "$app_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          app_ready="false"
          for tentativa in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              app_ready="true"
              break
            fi
            sleep 1
          done

          if [ "$app_ready" != "true" ]; then
            cat /tmp/historietas-k6-app.log
            echo "O app local não ficou pronto para o baseline do k6."
            exit 1
          fi

          K6_BASE_URL=http://127.0.0.1:3000             k6 run qa/load/k6-smoke.js

          cleanup
          trap - EXIT

          if curl --silent --max-time 1 http://127.0.0.1:3000/ >/dev/null 2>&1; then
            echo "O servidor usado pelo k6 permaneceu ativo na porta 3000."
            exit 1
          fi

      - name: Executar OWASP ZAP baseline passivo no app local
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p qa/reports/zap
          chmod 0777 qa/reports/zap

          npm run start > /tmp/historietas-zap-app.log 2>&1 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          app_ready="false"
          for tentativa in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              app_ready="true"
              break
            fi
            sleep 1
          done

          if [ "$app_ready" != "true" ]; then
            cat /tmp/historietas-zap-app.log
            echo "O app local não ficou pronto para o scan do ZAP."
            exit 1
          fi

          docker run --rm             --network host             -v "$PWD/qa/reports/zap:/zap/wrk:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py               -t http://127.0.0.1:3000               -m 1               -I               -s               -r zap-report.html               -J zap-report.json

      - name: Remover ambiente Supabase local
        if: ${{ always() }}
        run: |
          if supabase status >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

      - name: Salvar relatórios do Lighthouse
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar relatório do k6
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-baseline-report
          path: qa/reports/k6
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar relatório do OWASP ZAP
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-report
          path: qa/reports/zap
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar diagnóstico do Playwright em caso de falha
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            qa/playwright-report
            qa/reports/playwright-results.json
            qa/test-results
          if-no-files-found: ignore
          retention-days: 7


  knip:
    name: Knip (diagnóstico)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Analisar código não utilizado com Knip
        run: |
          npm run knip || echo "Knip encontrou candidatos; diagnóstico não bloqueante nesta fase."


  dependency-cruiser:
    name: Dependency Cruiser (diagnóstico)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Analisar dependências e ciclos
        run: npm run deps:cruise

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build
