name: RLS Ranking Geral - Hipotese anon em lote (somente QA)

on:
  push:
    branches:
      - qa/ranking-geral-rls-conjunto-2353

permissions:
  contents: read

concurrency:
  group: qa-ranking-geral-rls-conjunto-2353
  cancel-in-progress: true

jobs:
  analise:
    name: RLS anon por linha versus conjunto, Supabase descartavel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout da base da PR 2348 e do diagnostico QA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verificar sintaxe e seguranca do benchmark isolado
        shell: bash
        run: |
          set -euo pipefail
          node --check qa/benchmarks/ranking-geral-rls-conjunto.mjs
          test -f supabase/migrations/20261116230000_listar_ranking_geral.sql
          if git diff --name-only 5aac2c3ceb6bf5795b27606113285d21119251c1 HEAD | grep -vE '^(\.github/workflows/rls-ranking-geral-conjunto\.yml|qa/benchmarks/ranking-geral-rls-conjunto\.mjs)$'; then
            echo "::error::A branch QA alterou arquivos fora do benchmark."
            exit 1
          fi

      - name: Supabase CLI fixa (somente banco descartavel)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.116.0

      - name: Iniciar Supabase local com migrations e ACL originais
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='supabase/config.toml',source=readFileSync(path,'utf8');
          const section=source.match(/\[db\.pooler\][\s\S]*?(?=\n\[|$)/)?.[0];
          assert.ok(section,'Config pooler ausente');
          const update=section.replace(/^enabled = false$/m,'enabled = true')
            .replace(/^pool_mode = "transaction"$/m,'pool_mode = "session"');
          assert.match(update,/^enabled = true$/m);
          assert.match(update,/^pool_mode = "session"$/m);
          writeFileSync(path,source.replace(section,update));
          NODE
          cp qa/integration/supabase/20260826000637_normalizar_acl_baseline_local.sql \
             supabase/migrations/20260826000637_normalizar_acl_baseline_local.sql
          supabase start

      - name: Comparar linhas anon sob RLS original versus RLS set-based apenas em shadow tables QA
        run: node qa/benchmarks/ranking-geral-rls-conjunto.mjs

      - name: Encerrar Supabase local e eliminar QA
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null && supabase status >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
