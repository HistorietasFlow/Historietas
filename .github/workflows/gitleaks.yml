name: Gitleaks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código com histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks 8.30.1 com checksum
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"

          curl --fail --location --silent --show-error             --output "${archive}"             "${base_url}/${archive}"
          curl --fail --location --silent --show-error             --output checksums.txt             "${base_url}/gitleaks_${version}_checksums.txt"

          grep "  ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Analisar histórico Git por segredos
        continue-on-error: true
        run: gitleaks git --config=.gitleaks.toml --redact --verbose .
