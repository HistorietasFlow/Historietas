name: Gitleaks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código com histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validar instalador de ferramentas da CI
        run: node --test qa/unit/install-ci-tool.test.mjs

      - name: Restaurar arquivo oficial do Gitleaks
        id: gitleaks-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-tools/gitleaks
          key: ${{ runner.os }}-X64-gitleaks-${{ hashFiles('qa/scripts/install-ci-tool.mjs') }}

      - name: Instalar Gitleaks 8.30.1 com checksum
        run: node qa/scripts/install-ci-tool.mjs gitleaks "${{ runner.temp }}/ci-tools/gitleaks"

      - name: Guardar somente arquivo verificado do Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ci-tools/gitleaks
          key: ${{ steps.gitleaks-cache.outputs.cache-primary-key }}

      - name: Analisar histórico Git por segredos
        run: gitleaks git --config=.gitleaks.toml --redact --verbose .
