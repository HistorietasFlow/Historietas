name: Previa do Explorar - homologacao local

on:
  workflow_call:

permissions:
  contents: read

jobs:
  previa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3001/
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - name: Instalar dependencias travadas
        run: |
          npm ci
          npm --prefix qa ci

      - name: Preparar Chromium e dependências oficiais
        id: playwright-server
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PLAYWRIGHT_IMAGE"
          docker run --detach --interactive --init \
            --name "historietas-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --network host --ipc=host --user pwuser \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD/qa/node_modules,dst=/opt/qa/node_modules,readonly" \
            "$PLAYWRIGHT_IMAGE" \
            node /opt/qa/node_modules/playwright/cli.js run-server --host 127.0.0.1 --port 3001
          node qa/scripts/check-playwright-server.mjs

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.116.0

      - name: Preparar Supabase descartavel com expiracao curta
        shell: bash
        run: |
          set -euo pipefail
          supabase init
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'supabase/config.toml';
          const text = readFileSync(path, 'utf8');
          assert.match(text, /^jwt_expiry = [0-9]+$/m);
          writeFileSync(path, text.replace(/^jwt_expiry = [0-9]+$/m, 'jwt_expiry = 30'));
          NODE
          cp qa/integration/supabase/20260826000637_normalizar_acl_baseline_local.sql \
            supabase/migrations/20260826000637_normalizar_acl_baseline_local.sql
          supabase start > /tmp/qa-previa-start.log 2>&1 || {
            echo "::error::Supabase local indisponivel. Consulte o ambiente de QA."
            exit 1
          }

      - name: Conferir contrato SQL inativo
        run: supabase test db supabase/tests/database/previa_abertura_assinada.test.sql

      - name: Testar proxy, Auth, RLS, Vault, rotacao e cards
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env | node qa/integration/previa-rota-local.test.mjs --interface

      - name: Encerrar recursos descartaveis
        if: always()
        shell: bash
        run: |
          docker rm -f "historietas-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>/dev/null || true
          if command -v supabase >/dev/null && supabase status >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
