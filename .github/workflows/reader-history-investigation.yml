name: Reader history React A-B investigation
on:
  push:
    branches: [investigate/reader-history-react-ab]
permissions:
  contents: read
jobs:
  compare:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react: [19.2.4, 19.3.1]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_USER_EMAIL: e2e-author@historietas.test
      E2E_ALLOW_DESTRUCTIVE: "true"
      E2E_PUBLIC_WORK_SLUG: obra-publica-e2e
      E2E_PUBLIC_CHAPTER_NUMBER: "1"
      PROBE_REACT_VERSION: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install identical dependencies, then switch only the React pair
        run: |
          npm ci
          npm --prefix qa ci
          npm ls --all --json > /tmp/deps-before.json
          if [ "${{ matrix.react }}" = "19.2.4" ]; then
            mkdir -p /tmp/react-comparison-packages
            npm pack --pack-destination /tmp/react-comparison-packages react@19.2.4 react-dom@19.2.4 scheduler@0.27.0
            test -f node_modules/react/package.json
            test -f node_modules/react-dom/package.json
            test -f node_modules/scheduler/package.json
            rm -rf node_modules/react node_modules/react-dom node_modules/scheduler
            mkdir node_modules/react node_modules/react-dom node_modules/scheduler
            tar -xzf /tmp/react-comparison-packages/react-19.2.4.tgz -C node_modules/react --strip-components=1
            tar -xzf /tmp/react-comparison-packages/react-dom-19.2.4.tgz -C node_modules/react-dom --strip-components=1
            tar -xzf /tmp/react-comparison-packages/scheduler-0.27.0.tgz -C node_modules/scheduler --strip-components=1
          fi
          npm ls --all --json > /tmp/deps-after.json || true
          node -e 'const fs=require("fs"); const inventory=p=>{const result={}; const walk=(d,path="")=>{for(const [name,item] of Object.entries(d.dependencies||{})){const key=path+"/"+name; if(!["react","react-dom","scheduler"].includes(name)) result[key]=item.version; walk(item,key)}}; walk(JSON.parse(fs.readFileSync(p))); return result}; require("assert").deepStrictEqual(inventory("/tmp/deps-after.json"),inventory("/tmp/deps-before.json")); console.log("Only React/React DOM/scheduler changed in the installed dependency tree")'
          node -e 'for(const name of ["react","react-dom","@types/react","@types/react-dom","scheduler"]) console.log(name,require(name+"/package.json").version)'
          git diff --exit-code
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53
        with:
          version: 2.116.0
      - name: Start disposable local Supabase
        run: |
          supabase init
          cp qa/integration/supabase/20260826000637_normalizar_acl_baseline_local.sql supabase/migrations/20260826000637_normalizar_acl_baseline_local.sql
          supabase start
      - run: npm run test:e2e:prepare:local -- --github-env "$GITHUB_ENV"
      - run: npm run build
      - run: npm --prefix qa exec -- playwright install --with-deps chromium
      - name: Repeat only the original Back-Forward regression twelve times
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_WEB_SERVER_COMMAND: npm --prefix .. run start
        run: npm --prefix qa test -- tests/chapter-canonical.spec.mjs --grep 'sincroniza conteúdo e URL ao voltar e avançar entre capítulos' --repeat-each=12
      - name: Save comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reader-history-react-${{ matrix.react }}
          path: |
            qa/test-results
            qa/reports/playwright-results.json
            qa/playwright-report
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
